[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "candlesense"
version = "0.1.0"
description = "Lê o gráfico da IQ Option na tela e estima a direção do próximo movimento (somente leitura)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10",
    # OCR reserva para Linux/Windows. No macOS o OCR é o Vision da Apple; o rapidocr
    # depende do onnxruntime, que não tem versão para Mac Intel nem Python 3.14.
    "rapidocr-onnxruntime>=1.2; sys_platform != 'darwin'",
    # macOS: captura, janelas, permissões, OCR nativo e Acessibilidade
    "pyobjc-core>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
rapidocr = ["rapidocr-onnxruntime>=1.2"]

[project.scripts]
candlesense = "candlesense.__main__:main"

[tool.setuptools.packages.find]
include = ["candlesense*"]

[tool.setuptools.package-data]
"candlesense.ui" = ["fonts/*.otf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
